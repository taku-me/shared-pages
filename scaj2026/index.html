/* ═══════════════════════════════════════════════════
   DESIGN TOKENS — 3 themes

  --surface:     #161c27;
  --surface-h:   #1e2535;
  --border:      rgba(255,255,255,0.08);

  --text:        #e8eaed;

  --accent2:     #d4af37;
  --pill-bg:     rgba(74,155,142,0.15);

  --on-accent:   #ffffff;
  --scheme:      dark;
  --sw-dark:     #1e2535;
  --sw-light:    #ffffff;
  --sw-light-ring: rgba(0,0,0,0.18);
  --sw-v-a:      #00d9ff;
  --sw-v-b:      #b04eff;
}

[data-theme="light"] {
  --bg:          #f5f7fa;

  --border:      rgba(0,0,0,0.08);
  --border-h:    rgba(0,0,0,0.16);
  --text:        #1a2332;
  --text-muted:  rgba(26,35,50,0.45);
  --accent:      #4a8a7b;
  --accent-dim:  rgba(74,138,123,0.1);
  --accent2:     #9c8054;
  --pill-bg:     rgba(74,138,123,0.1);
  --pill-fg:     #3d7468;
  --arrow:       rgba(26,35,50,0.25);
  --arrow-h:     #4a8a7b;
  --on-accent:   #ffffff;
  --scheme:      light;
  --sw-dark:     #1e2535;
  --sw-light:    #ffffff;
  --sw-light-ring: rgba(0,0,0,0.18);
  --sw-v-a:      #00d9ff;
  --sw-v-b:      #b04eff;
}

[data-theme="vivid"] {
  --bg:          #060918;
  --surface:     #0d1230;
  --surface-h:   #131838;
  --border:      rgba(100,120,255,0.18);
  --border-h:    rgba(0,217,255,0.35);
  --text:        #f0f4ff;
  --text-muted:  rgba(240,244,255,0.42);
  --accent:      #00d9ff;
  --accent-dim:  rgba(0,217,255,0.12);
  --accent2:     #b04eff;
  --pill-bg:     rgba(0,217,255,0.1);
  --pill-fg:     #00d9ff;
  --arrow:       rgba(240,244,255,0.25);
  --arrow-h:     #00d9ff;
  --on-accent:   #06131a;
  --scheme:      dark;
  --sw-dark:     #1e2535;
  --sw-light:    #ffffff;
  --sw-light-ring: rgba(0,0,0,0.18);
  --sw-v-a:      #00d9ff;
  --sw-v-b:      #b04eff;
}

:root{
  --fs-0:15px;  /* 最小。補足・ピル・メタ情報 */
  --fs-1:18px;  /* 本文 */
  --fs-2:21px;  /* 中見出し */
  --fs-3:25px;  /* カード見出し */
  --fs-4:33px;  /* ページ見出し */
}

/* ── base ─────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { color-scheme: var(--scheme); }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
  min-height: 100vh;
  min-height: 100dvh;
  overflow-wrap: anywhere;
  transition: background 0.25s, color 0.25s;
}
pre, table { max-width: 100%; overflow-x: auto; }
img, video, iframe { max-width: 100%; height: auto; }
a { color: var(--accent); }

.wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px; }

/* ── header ───────────────────────────── */
header.site { padding: 22px 0 14px; }
h1 {
  font-size: var(--fs-4);
  font-weight: 700;
  line-height: 1.3;
  color: var(--text);
  border-bottom: 2px solid var(--border);
  padding-bottom: 10px;
}
.sub { font-size: var(--fs-0); color: var(--text-muted); margin-top: 8px; line-height: 1.6; }

/* ── filters ──────────────────────────── */
.filters { margin-bottom: 4px; }
@media (min-width: 900px) {
  .filters {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg); color: var(--text);
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }
}
.filters .panel {
  background: var(--surface); color: var(--text);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px;
}
.fgrid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(210px, 100%), 1fr));
  gap: 10px;
}
.field label {
  display: block;
  font-size: var(--fs-0);
  font-weight: 600;
  color: var(--text-muted);
  margin-bottom: 4px;
}
select, input[type="search"] {
  width: 100%;
  font-size: var(--fs-1);
  font-family: inherit;
  background: var(--bg); color: var(--text);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 10px;
}
select:hover, input[type="search"]:hover { border-color: var(--border-h); }
select:focus, input[type="search"]:focus {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
  border-color: var(--accent);
}
.resultline {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 12px;
}
#count { font-size: var(--fs-1); font-weight: 600; color: var(--text); }
#f-reset {
  font-size: var(--fs-0);
  font-weight: 600;
  font-family: inherit;
  background: var(--surface); color: var(--text);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 6px 12px;
  cursor: pointer;
}
#f-reset:hover:not(:disabled) { border-color: var(--border-h); background: var(--surface-h); }
#f-reset:disabled { opacity: 0.45; cursor: default; }

/* ── bento grid / cards ───────────────── */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr));
  gap: 1px;
  background: var(--border); color: var(--text);
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
  margin-top: 14px;
}
.card {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 18px;
  background: var(--surface); color: var(--text);
  position: relative;
  transition: background 0.15s;
}
.card:hover { background: var(--surface-h); }
[data-theme="vivid"] .card:hover { box-shadow: inset 0 0 0 1px var(--border-h); }

.card-top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.booth {
  font-size: var(--fs-2);
  font-weight: 700;
  font-family: "SF Mono", "Fira Code", monospace;
  background: var(--accent-dim); color: var(--accent);
  border-radius: 6px;
  padding: 2px 8px;
}
h2.cname {
  font-size: var(--fs-3);
  font-weight: 700;
  color: var(--text);
  line-height: 1.3;
}
.hq { font-size: var(--fs-0); color: var(--text); line-height: 1.5; }
.hlbl {
  font-size: var(--fs-0);
  font-weight: 700;
  color: var(--text-muted);
  letter-spacing: 0.04em;
  margin-right: 6px;
}
.sum { font-size: var(--fs-1); line-height: 1.55; color: var(--text); }
.nolink { font-size: var(--fs-0); color: var(--text-muted); }

.badges { display: flex; gap: 6px; flex-wrap: wrap; }
.pill {
  background: var(--pill-bg); color: var(--pill-fg);
  border-radius: 5px;
  padding: 0.12em 0.5em;
  font-size: var(--fs-0);
  font-weight: 600;
  letter-spacing: 0.02em;
}
.tnote { font-size: var(--fs-0); color: var(--text-muted); line-height: 1.5; }
.days { display: flex; gap: 4px; flex-wrap: wrap; }

.links { display: flex; gap: 14px; flex-wrap: wrap; margin-top: auto; padding-top: 2px; }
a.link {
  font-size: var(--fs-0);
  font-weight: 600;
  color: var(--accent);
  text-decoration: none;
  border-bottom: 1px solid var(--border);
  overflow-wrap: anywhere;
}
a.link:hover { border-color: var(--accent); }

/* ── empty state ──────────────────────── */
.empty {
  background: var(--surface); color: var(--text);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 40px 20px;
  text-align: center;
  margin-top: 14px;
}
.empty .t { font-size: var(--fs-2); font-weight: 700; color: var(--text); margin-bottom: 6px; }
.empty .s { font-size: var(--fs-0); color: var(--text-muted); }

/* ── settings (theme) ─────────────────── */
.settings { margin: 28px 0 0; }
.settings h2 {
  font-size: var(--fs-3);
  font-weight: 700;
  color: var(--text);
  line-height: 1.3;
  margin-bottom: 8px;
  padding-bottom: 10px;
  border-bottom: 2px solid var(--border);
}
.settings p { font-size: var(--fs-0); color: var(--text-muted); margin: 0 0 12px; }
.theme-bar { display: flex; gap: 10px; flex-wrap: wrap; }
.theme-btn {
  display: flex; align-items: center; gap: 8px;
  font-size: var(--fs-0);
  font-weight: 600;
  font-family: inherit;
  padding: 8px 14px;
  border-radius: 9px;
  cursor: pointer;
  background: var(--surface-h); color: var(--text);
  border: 2px solid var(--border);
}
.theme-btn:hover { border-color: var(--border-h); }
.theme-btn .sw { width: 16px; height: 16px; border-radius: 50%; flex: 0 0 auto; }
.theme-btn[data-t="dark"]  .sw { background: var(--sw-dark); color: var(--sw-dark); }
.theme-btn[data-t="light"] .sw { background: var(--sw-light); color: var(--sw-light); box-shadow: inset 0 0 0 1px var(--sw-light-ring); }
.theme-btn[data-t="vivid"] .sw { background: conic-gradient(var(--sw-v-a), var(--sw-v-b), var(--sw-v-a)); color: var(--sw-v-a); }
[data-theme="dark"]  .theme-btn[data-t="dark"],
[data-theme="light"] .theme-btn[data-t="light"],
[data-theme="vivid"] .theme-btn[data-t="vivid"] {
  border-color: var(--accent);
  background: var(--accent-dim); color: var(--text);
}

/* ── footer note ──────────────────────── */
.note {
  margin: 24px 0 40px;
  padding-top: 14px;
  border-top: 1px solid var(--border);
  font-size: var(--fs-0);
  color: var(--text-muted);
  line-height: 1.6;
}
</style>
</head>

.com/wonderfulworldcoffee/"],"status":"ok","days":["10/14","10/15","10/16"]},{"booth":"011","name":"one by one coffee／MARUS COFFEE","hq_area":"東京都渋谷区（one by one coffee：恵比寿。MARUS COFFEEは中国・蘇州）","hq_pref":"東京都","website":"https://onebyonecoffee.co.jp/","instagram":"https://www.instagram.com/one_by_one_coffee_tokyo/","summary":"東京・恵比寿のone by one coffee（競札ロットやBest of Panamaなど希少豆を扱う専門店）と、WBC世界チャンピオン出身者が率いる中国・蘇州のMARUS COFFEE马路咖啡による共同出展。","tokyo_store":"あり","tokyo_note":"公式サイトのADDRESSにJapan - Tokyo, Ebisu / Ebisu Garden Place, 4-20-7 Ebisu, Shibuya, Tokyoが掲載","sources":["https://onebyonecoffee.co.jp/","https://onebyonecoffee.co.jp/stores","https://www.instagram.com/p/DX3kFWzGsNi/","https://www.instagram.com/one_by_one_coffee_tokyo/","https://www.instagram.com/marus_coffee/","https://www.archdaily.com/1025412/marus-coffee-and-coffee-academy-atelier-in"],"status":"ok","days":["10/14","10/15","10/16","10/17"]}]</script>
<script>
(function(){
"use strict";

var DATA = JSON.parse(document.getElementById("data").textContent);
var TOTAL = DATA.length;

/* 都道府県（郵便番号順）— エリア順ソート用 */
var ORDER = ["北海道","青森県","岩手県","宮城県","秋田県","山形県","福島県",
"茨城県","栃木県","群馬県","埼玉県","千葉県","東京都","神奈川県",
"新潟県","富山県","石川県","福井県","山梨県","長野県","岐阜県","静岡県","愛知県",
"三重県","滋賀県","京都府","大阪府","兵庫県","奈良県","和歌山県",
"鳥取県","島根県","岡山県","広島県","山口県","徳島県","香川県","愛媛県","高知県",
"福岡県","佐賀県","長崎県","熊本県","大分県","宮崎県","鹿児島県","沖縄県"];

function $(id){ return document.getElementById(id); }
function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
  });
}
function unl(v){ return (v === null || v === undefined || v === "") ? "未確認" : v; }

var selPref  = $("f-pref");
var selTokyo = $("f-tokyo");
var selDay   = $("f-day");
var selSort  = $("f-sort");
var inQ      = $("f-q");
var countEl  = $("count");
var grid     = $("grid");
var emptyEl  = $("empty");
var resetBtn = $("f-reset");

/* エリア選択肢（件数付き。未確認を最後に追加） */
(function buildPrefOptions(){
  var counts = {};
  DATA.forEach(function(d){
    var k = (d.hq_pref === null || d.hq_pref === undefined) ? "__null__" : String(d.hq_pref);
    counts[k] = (counts[k] || 0) + 1;
  });
  var opts = [["", "全て (" + TOTAL + ")"]];
  var keys = Object.keys(counts).filter(function(k){ return k !== "__null__"; });
  keys.sort(function(a, b){
    var ia = ORDER.indexOf(a), ib = ORDER.indexOf(b);
    if(ia !== -1 && ib !== -1) return ia - ib;
    if(ia !== -1) return -1;
    if(ib !== -1) return 1;
    return a.localeCompare(b, "ja");
  });
  keys.forEach(function(k){ opts.push([k, k + " (" + counts[k] + ")"]); });
  if(counts["__null__"]){ opts.push(["__null__", "未確認 (" + counts["__null__"] + ")"]); }
  selPref.innerHTML = opts.map(function(o){
    return '<option value="' + esc(o[0]) + '">' + esc(o[1]) + "</option>";
  }).join("");
})();

function prefRank(v){
  if(v === null || v === undefined) return 9900;
  var i = ORDER.indexOf(v);
  if(i !== -1) return i;
  return 9000; /* 海外 */
}
function cmpPref(a, b){
  var ra = prefRank(a), rb = prefRank(b);
  if(ra !== rb) return ra - rb;
  return unl(a).localeCompare(unl(b), "ja");
}

function getFiltered(){
  var pref  = selPref.value;
  var tok   = selTokyo.value;
  var day   = selDay.value;
  var q     = inQ.value.trim().toLowerCase();
  var out = [];
  for(var i = 0; i < TOTAL; i++){
    var d = DATA[i];
    if(pref){
      if(pref === "__null__"){
        if(d.hq_pref !== null && d.hq_pref !== undefined) continue;
      } else if(String(d.hq_pref === null ? "" : d.hq_pref) !== pref) continue;
    }
    if(tok && d.tokyo_store !== tok) continue;
    if(day && !(d.days && d.days.indexOf(day) !== -1)) continue;
    if(q){
      var hay = (String(d.name || "") + " " + String(d.booth || "") + " " + String(d.summary || "")).toLowerCase();
      if(hay.indexOf(q) === -1) continue;
    }
    out.push(d);
  }
  return out;
}

function sortList(list){
  var s = selSort.value;
  if(s === "name"){
    list.sort(function(a, b){ return String(a.name || "").localeCompare(String(b.name || ""), "ja"); });
  } else if(s === "pref"){
    list.sort(function(a, b){
      var c = cmpPref(a.hq_pref, b.hq_pref);
      if(c !== 0) return c;
      return String(a.booth || "").localeCompare(String(b.booth || ""));
    });
  } else {
    list.sort(function(a, b){
      var x = parseInt(a.booth, 10), y = parseInt(b.booth, 10);
      if(!isNaN(x) && !isNaN(y) && x !== y) return x - y;
      return String(a.booth || "").localeCompare(String(b.booth || ""));
    });
  }
}

function cardHTML(d){
  var h = [];
  h.push('<article class="card">');
  h.push('<div class="card-top">');
  h.push('<span class="booth">' + esc(d.booth) + "</span>");
  h.push('<h2 class="cname">' + esc(d.name) + "</h2>");
  h.push("</div>");
  h.push('<div class="hq"><span class="hlbl">本店</span>' + esc(unl(d.hq_area)) + "</div>");
  if(d.summary !== null && d.summary !== undefined){
    h.push('<p class="sum">' + esc(d.summary) + "</p>");
  } else {
    h.push('<p class="nolink">紹介文：未確認</p>');
  }
  h.push('<div class="badges"><span class="pill">都内店舗：' + esc(d.tokyo_store || "不明") + "</span></div>");
  if(d.tokyo_note !== null && d.tokyo_note !== undefined){
    h.push('<p class="tnote">' + esc(d.tokyo_note) + "</p>");
  }
  var days = (d.days && d.days.length) ? d.days : [];
  h.push('<div class="days">' + (
    days.length
      ? days.map(function(x){ return '<span class="pill">' + esc(x) + "</span>"; }).join("")
      : '<span class="nolink">出展日：未確認</span>'
  ) + "</div>");
  h.push('<div class="links">');
  h.push(d.website
    ? '<a class="link" href="' + esc(d.website) + '" target="_blank" rel="noopener noreferrer">公式サイト</a>'
    : '<span class="nolink">公式サイト：未確認</span>');
  h.push(d.instagram
    ? '<a class="link" href="' + esc(d.instagram) + '" target="_blank" rel="noopener noreferrer">Instagram</a>'
    : '<span class="nolink">Instagram：未確認</span>');
  h.push("</div>");
  h.push("</article>");
  return h.join("");
}

function render(){
  var list = getFiltered();
  sortList(list);
  countEl.textContent = "全 " + TOTAL + " 件の中から " + list.length + " 件の出展者を表示中";
  grid.innerHTML = list.map(cardHTML).join("");
  emptyEl.hidden = list.length > 0;
  var active = selPref.value !== "" || selTokyo.value !== "" ||
               selDay.value !== "" || inQ.value.trim() !== "" ||
               selSort.value !== "booth";
  resetBtn.disabled = !active;
}

[selPref, selTokyo, selDay, selSort].forEach(function(el){
  el.addEventListener("change", render);
});
inQ.addEventListener("input", render);
resetBtn.addEventListener("click", function(){
  selPref.value = "";
  selTokyo.value = "";
  selDay.value = "";
  selSort.value = "booth";
  inQ.value = "";
  render();
});
render();

/* テーマ切替 */
window.setTheme = function(t){
  if(t !== "light" && t !== "dark" && t !== "vivid") return;
  document.documentElement.setAttribute("data-theme", t);
  try { localStorage.setItem("sb-theme", t); } catch(e) {}
};

})();
</script>
